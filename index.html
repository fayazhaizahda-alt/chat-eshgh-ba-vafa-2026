<body>
<header>
<h2>❤️ چت عشق با وفا ❤️</h2>
<p>دوستی، مهربانی و احترام</p>
</header>

<main>
<div class="panel" id="login">
<h3>خوش آمدید ❤️</h3>

<button class="mode active" id="loginMode" onclick="setMode('login')">ورود</button>
<button class="mode" id="registerMode" onclick="setMode('register')">ثبت‌نام</button>

<input id="username" placeholder="نام کاربری">
<input id="password" type="password" placeholder="رمز عبور">

<div id="photoArea" style="display:none">
<label>عکس پروفایل (اختیاری):</label>
<input type="file" id="photo" accept="image/*">

async function usernameEmail(name){
 const normalized=name.trim().toLowerCase();
 const bytes=new TextEncoder().encode(normalized);
 const hash=await crypto.subtle.digest("SHA-256",bytes);
 const hex=Array.from(new Uint8Array(hash))
  .map(b=>b.toString(16).padStart(2,"0")).join("");
 return {
  key:hex,
  email:"u-"+hex+"@login.chat-eshgh-ba-vafa.com"
 };
}

async function detectCountry(){
 try{
  const response=await fetch("https://ipwho.is/");
  if(!response.ok)throw new Error("country lookup failed");
  const data=await response.json();
  if(data.success===false||!data.country_code)return {};
  return {countryCode:String(data.country_code).toUpperCase(),countryName:data.country||""};
 }catch(e){return {};}
}
function countryFlag(code){
 if(!code||!/^[A-Z]{2}$/.test(code))return "🌐";
 return String.fromCodePoint(...[...code].map(ch=>127397+ch.charCodeAt(0)));
}

async function compressPhoto(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement("canvas");
    const scale=Math.min(1,180/img.width,180/img.height);
    canvas.width=img.width*scale;
    canvas.height=img.height*scale;
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",.65));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

function normalizeBotText(value){
 return String(value||"").toLowerCase()
  .replace(/[يى]/g,"ی").replace(/ك/g,"ک")
  .replace(/[\u200c\u200f]/g," ")
  .replace(/[ًٌٍَُِّْـ]/g," ")
  .replace(/\s+/g," ").trim();
}

function isOffensiveMessage(value){
 const normalized=normalizeBotText(value);
 const words=normalized.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
 const blockedWords=[
  "احمق","بی‌شعور","بی شعور","حرامزاده","حرامی","کثافت",
  "فاحشه","جنده","مادرجنده","پدرسوخته","بی‌ناموس","بی ناموس",
  "ولدزنا","کسکش","کونی","گوه","گوهی","سگ پدر",
  "fuck","fucking","bitch","shit","asshole"
 ];
 return blockedWords.some(term=>{
  const t=normalizeBotText(term);
  return t.includes(" ") ? normalized.includes(t) : words.includes(t);
 });
}

async function sendBotMessage(message){
 try{
  if(!me)throw new Error("کاربر هنوز وارد حساب نشده است");
  // برای سازگاری با قوانین Firestore، پیام ربات با حساب واردشده ثبت می‌شود
  // اما فیلد bot باعث می‌شود در صفحه با نام و ظاهر هیله نمایش داده شود.
  await addDoc(collection(db,"messages"),{
   senderUid:me.uid,
   senderName:"هیله",
   text:message,
   type:"public",
   bot:true,
   createdAt:serverTimestamp()
  });
 }catch(e){console.error("Bot message failed:",e);$("roomTitle").textContent="خطای ارسال پیام هیله: "+(e.message||e);}
}

function startBotModeration(){
 if(me?.uid!==OWNER_UID)return;
 if(moderationUnsub)moderationUnsub();
 const publicQuery=query(collection(db,"messages"),where("type","==","public"));
 moderationUnsub=onSnapshot(publicQuery,snapshot=>{
  snapshot.docChanges().forEach(async change=>{
   if(change.type!=="added")return;
   const message={id:change.doc.id,...change.doc.data({serverTimestamps:"estimate"})};
   if(!message.senderUid || message.senderUid==="CHAT_BOT" ||
      message.bot || botProcessed.has(message.id))return;
   const created=message.createdAt?.toMillis?.()||
    (typeof message.createdAt==="number"?message.createdAt:0);
   if(!created || Date.now()-created>45000)return;
   botProcessed.add(message.id);

   // کاربران عادی برای توهین مسدود می‌شوند؛ مالک مستثنا است.
   if(message.senderUid!==OWNER_UID && isOffensiveMessage(message.text)){
    try{
     await deleteDoc(doc(db,"messages",message.id));
     await updateDoc(doc(db,"users",message.senderUid),{
      banned:true,bannedBy:"CHAT_BOT",bannedAt:Date.now(),
      banReason:"توهین و استفاده از الفاظ نامناسب"
     });
     await sendBotMessage("🛡️ ربات: پیام توهین‌آمیز حذف شد و حساب فرستنده مسدود گردید.");
    }catch(e){console.error("Bot moderation failed:",e);}
    return;
   }

   // هیله به سلام همه کاربران، حتی مالک، پاسخ می‌دهد.
   if(/سلام|درود|السلام علیکم|السلام‌علیکم/u.test(normalizeBotText(message.text))){
    await sendBotMessage("وعلیکم‌السلام! خوش آمدی ❤️");
   }
  });
 },error=>console.error("Bot moderation listener failed:",error));
}

function listenMessages(type){
 stopMessages();
 $("messages").innerHTML="در حال دریافت پیام‌ها...";
 let q;

 if(type==="public"){
  q=query(collection(db,"messages"),where("type","==","public"));
 }else{
  q=query(collection(db,"messages"),
   where("members","array-contains",me.uid));
 }

 messagesUnsub=onSnapshot(q,snap=>{
  let arr=snap.docs.map(d=>({id:d.id,...d.data()}));

  if(type==="private"){
   arr=arr.filter(m=>m.members?.includes(activePeer.uid));
  }

  arr.sort((a,b)=>
   (a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0)
  );
  arr=arr.slice(-100);
  renderMessages(arr);
 },e=>{
  $("messages").textContent="خطا در دریافت پیام‌ها: "+e.message;
 });
}

   name.title="ربات رسمی چت عشق با وفا";

  const body=document.createElement("span");

  div.append(name,body);

 });
 box.scrollTop=box.scrollHeight;
}

window.sendMessage=async function(){

  };

  if(activePeer){
   data.type="private";
   data.members=[me.uid,activePeer.uid];

  }

  await addDoc(collection(db,"messages"),data);
  $("message").value="";
 }catch(e){
  alert("پیام ارسال نشد: "+e.message);
 }
};

 if(myRole==="manager")return ["user","moderator"];

   };row.append(select,save);
  }
  if(myRole!=="moderator"&&!u.banned){
   const ban=document.createElement("button");ban.textContent="اخراج و مسدودسازی";
   ban.onclick=async()=>{if(!confirm("این حساب مسدود شود؟ کاربر دیگر نمی‌تواند وارد چت شود."))return;
    try{await updateDoc(doc(db,"users",u.uid),{banned:true,bannedBy:me.uid,bannedAt:Date.now()});alert("حساب مسدود شد.");}
    catch(e){alert("مسدودسازی انجام نشد: "+e.message);}
   };row.append(ban);
  }
  list.append(row);
 });
}
async function removeMessage(messageId){
 if(myRole==="user")return;if(!confirm("این پیام حذف شود؟"))return;
 try{await deleteDoc(doc(db,"messages",messageId));}
 catch(e){alert("حذف پیام انجام نشد: "+e.message);}
}
window.addEmoji=function(emoji){
 $("message").value+=emoji;
 $("message").focus();
};

window.exitChat=async function(){
 if(heartbeat)clearInterval(heartbeat);
 heartbeat=null;
 stopMessages();

 if(usersUnsub){
  usersUnsub();
  usersUnsub=null;
 }
 if(moderationUnsub){
  moderationUnsub();
  moderationUnsub=null;
 }

 if(me){
  try{
   await updateDoc(doc(db,"users",me.uid),{lastSeen:0});
  }catch(e){}
 }

 await signOut(auth);
 me=null;
 activePeer=null;

 $("chat").style.display="none";
 $("login").style.display="block";
 $("message").value="";
 $("password").value="";
};
</script>
</body>
</html>
