
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت عشق با وفا ۲۰۲۶</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.95) 0 3%,transparent 24%),radial-gradient(circle at 88% 78%,rgba(255,220,235,.75) 0 4%,transparent 27%),linear-gradient(135deg,#dceeff 0%,#f8eaff 48%,#e3f5ff 100%);background-attachment:fixed;color:#1d2b45}
header{background:#1769c2;color:white;text-align:center;padding:15px}
main{max-width:950px;margin:15px auto;padding:10px}
.panel{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #ddd}
input,button{font-family:Tahoma;padding:12px;border-radius:9px;border:1px solid #ccc;font-size:14px}

#roomTitle{font-size:13px;margin:2px 0 5px}

#layout>.panel>button{padding:5px 7px;font-size:10px;border-radius:6px}
#returnPublicBtn{display:inline-block;width:auto;min-width:0;padding:3px 6px;font-size:9px;line-height:15px;margin:2px 0;border-radius:5px}
#sendArea input{padding:6px;font-size:11px;margin:3px 0}
#sendArea button{padding:6px 8px;font-size:10px;min-width:48px}
#emoji button{padding:3px;margin:1px;font-size:11px}
#messages{height:420px;overflow-y:auto;background-color:#fff8fc;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2790%27 height=%2778%27 viewBox=%270 0 90 78%27%3E%3Cpath d=%27M22 16 C22 9 32 7 36 15 C40 7 50 9 50 16 C50 24 36 32 36 32 C36 32 22 24 22 16Z%27 fill=%27%23f5a8c5%27 fill-opacity=%270.30%27/%3E%3Cpath d=%27M62 48 C62 42 70 40 74 47 C78 40 86 42 86 48 C86 55 74 62 74 62 C74 62 62 55 62 48Z%27 fill=%27%238bbcf0%27 fill-opacity=%270.25%27/%3E%3C/svg%3E"),linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,239,247,.94));background-size:90px 78px,auto;padding:10px;border-radius:10px;border:1px solid #f2cddd}
.msg{background:#e4efff;padding:10px;margin:8px 0;border-radius:10px;overflow-wrap:anywhere}
.mine{background:#d9f2df}
.user{display:flex;align-items:center;gap:3px;padding:3px;border-bottom:1px solid #eee;width:100%;text-align:right;font-size:10px}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#dceaff;border:1px solid #b7d5ff}
#myPhoto{width:96px;height:96px;display:block;margin:4px 0 10px}

#users h3{font-size:10px;margin:1px 0 4px}
#userList{font-size:9px}
#users .user{gap:2px;padding:2px;font-size:9px;min-height:24px}
#users .avatar{width:20px;height:20px;border-width:1px}
#users .dot{width:6px;height:6px}
.msg{padding:6px;margin:5px 0;font-size:12px}
#logoutBtn{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;width:fit-content!important;max-width:76px!important;min-width:0!important;height:10px!important;min-height:10px!important;padding:0 3px!important;margin:0!important;font-size:7px!important;line-height:9px!important;border-radius:3px!important;white-space:nowrap!important}
.dot{display:inline-block;width:9px;height:9px;background:#20bd62;border-radius:50%}
#profileCard{padding:18px;margin:10px 0;text-align:center}#profileCard button{margin:5px;padding:8px 12px;font-size:12px}#profileCardPhoto{display:block;margin:0 auto 8px}
#sendArea{display:flex;gap:7px}
#sendArea input{flex:1;min-width:0}
#sendArea button{min-width:75px}
#emoji button{width:auto;padding:6px;margin:3px;background:#eee;color:#333}
.small{font-size:12px;color:#777}
#chat{display:none}
.mode{background:#e5efff;color:#1769c2;margin:3px}
.mode.active{background:#1769c2;color:white}
@media(max-width:600px){
 #layout{grid-template-columns:1fr}
 #messages{height:320px}
 #users{max-height:90px;overflow:auto;padding:5px}
}
</style>
</head>
<body>
<header>
<h2>❤️ چت عشق با وفا ❤️</h2>
<p>دوستی، مهربانی و احترام</p>
</header>

<main>
<div class="panel" id="login">
<h3>خوش آمدید ❤️</h3>

<button class="mode active" id="loginMode" onclick="setMode('login')">ورود</button>
<button class="mode" id="registerMode" onclick="setMode('register')">ثبت‌نام</button>

<input id="username" placeholder="نام کاربری">

<div id="photoArea" style="display:none">

<input type="file" id="photo" accept="image/*">
</div>

<button id="enterBtn" onclick="enterChat()">ورود به چت</button>
<p class="small">کشور کنار پروفایل به‌صورت تقریبی از نشانی اینترنتی (IP) تشخیص داده می‌شود؛ VPN ممکن است کشور را تغییر دهد.</p>
<p id="error" class="small"></p>
</div>

<div id="chat">
<div class="panel">
<img id="myPhoto" class="avatar" alt="عکس پروفایل">
<button type="button" onclick="document.getElementById('profilePhotoInput').click()">📷 تغییر عکس پروفایل</button>

<h3 id="welcome"></h3>
<span class="dot"></span> آنلاین
<p class="small">شناسه کاربری: <span id="myUid"></span></p>

</div>

<div class="panel" id="adminPanel" style="display:none">
<h3>🛡️ پنل مدیریت</h3>
<p class="small">مدیریت رتبه‌ها، مسدودسازی کاربران و حذف پیام‌های نامناسب</p>
<div id="adminUsers"></div>
</div>

<div class="panel" id="profileCard" style="display:none;text-align:center">
<img id="profileCardPhoto" alt="عکس پروفایل" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #b7d5ff">
<h3 id="profileCardName"></h3>
<p id="profileCardUsername" style="font-size:16px;font-weight:bold;color:#1769c2"></p>
<p id="profileCardStatus" class="small"></p>
<button type="button" onclick="chatWithProfile()">💬 گفتگوی خصوصی</button>
<button type="button" onclick="closeProfile()">بستن</button>
</div>

<div id="layout">
<div class="panel" id="users">
<h3>👥 کاربران آنلاین</h3>
<div id="userList"></div>
</div>

<div class="panel">
<h3 id="roomTitle">💬 گفت‌وگوی عمومی</h3>
<button id="returnPublicBtn" onclick="openPublic()">بازگشت به گفت‌وگوی عمومی</button>
<div id="messages"></div>
<div id="emoji">
<button onclick="addEmoji('❤️')">❤️</button>
<button onclick="addEmoji('😍')">😍</button>
<button onclick="addEmoji('😂')">😂</button>
<button onclick="addEmoji('😘')">😘</button>
<button onclick="addEmoji('🌹')">🌹</button>
<button onclick="addEmoji('👍')">👍</button>
</div>
<div id="sendArea">
<input id="message" placeholder="پیام خود را بنویسید">
<button onclick="sendMessage()">ارسال</button>
</div>
</div>
</div>
</div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 getFirestore,collection,doc,setDoc,updateDoc,
 addDoc,query,where,onSnapshot,serverTimestamp,
 getDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBuj3nb-ACIwFVkCnuzRqFRwCRz323nQ9I",
 authDomain:"chat-eshgh-ba-vafa.firebaseapp.com",
 projectId:"chat-eshgh-ba-vafa",
 storageBucket:"chat-eshgh-ba-vafa.firebasestorage.app",
 messagingSenderId:"235744727404",
 appId:"1:235744727404:web:8f02d62853698462cba349",
 measurementId:"G-NR1076K019"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

// حساب مالک اصلی برنامه
const OWNER_UID="eaZWtnAluVMZ1bjDMrKcu8hye6t1";

let me=null;
let myRole="user";
let myName="";
let myPhoto="";
let activePeer=null;
let usersUnsub=null;
let messagesUnsub=null;
let heartbeat=null;
let allUsers=[];
let mode="login";

const $=id=>document.getElementById(id);

window.setMode=function(value){
 mode=value;
 $("loginMode").classList.toggle("active",mode==="login");
 $("registerMode").classList.toggle("active",mode==="register");
 $("photoArea").style.display=mode==="register"?"block":"none";
 $("enterBtn").textContent=mode==="register"?"ثبت‌نام و ورود":"ورود به چت";
 $("error").textContent="";
};

async function usernameEmail(name){
 const normalized=name.trim().toLowerCase();
 const bytes=new TextEncoder().encode(normalized);
 const hash=await crypto.subtle.digest("SHA-256",bytes);
 const hex=Array.from(new Uint8Array(hash))
  .map(b=>b.toString(16).padStart(2,"0")).join("");
 return {
  key:hex,
  email:"u-"+hex+"@login.chat-eshgh-ba-vafa.com"
 };
}

async function detectCountry(){
 try{
  const response=await fetch("https://ipwho.is/");
  if(!response.ok)throw new Error("country lookup failed");
  const data=await response.json();
  if(data.success===false||!data.country_code)return {};
  return {countryCode:String(data.country_code).toUpperCase(),countryName:data.country||""};
 }catch(e){return {};}
}
function countryFlag(code){
 if(!code||!/^[A-Z]{2}$/.test(code))return "🌐";
 return String.fromCodePoint(...[...code].map(ch=>127397+ch.charCodeAt(0)));
}

async function compressPhoto(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement("canvas");
    const scale=Math.min(1,180/img.width,180/img.height);
    canvas.width=img.width*scale;
    canvas.height=img.height*scale;
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",.65));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

window.changeProfilePhoto=async function(event){
 const file=event.target.files&&event.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("لطفاً یک عکس انتخاب کنید.");event.target.value="";return;}
 if(file.size>8*1024*1024){alert("حجم عکس باید کمتر از ۸ مگابایت باشد.");event.target.value="";return;}
 if(!me){alert("ابتدا وارد چت شوید.");return;}
 const status=$("photoStatus");
 status.textContent="در حال ذخیره عکس...";
 try{
  const photo=await compressPhoto(file);
  await updateDoc(doc(db,"users",me.uid),{photo:photo});
  myPhoto=photo;
  $("myPhoto").src=photo;
  status.textContent="عکس پروفایل با موفقیت ذخیره شد.";
  renderUsers();
 }catch(e){
  status.textContent="ذخیره عکس انجام نشد: "+(e.message||"خطای نامشخص");
 }finally{event.target.value="";}
};

window.enterChat=async function(){
 const name=$("username").value.trim();
 const password=$("password").value;

 if(name.length<2||name.length>25){
  $("error").textContent="نام کاربری باید بین ۲ تا ۲۵ حرف باشد";
  return;
 }
 if(password.length<6){
  $("error").textContent="رمز عبور باید حداقل ۶ حرف یا عدد باشد";
  return;
 }

 $("enterBtn").disabled=true;
 $("error").textContent="لطفاً صبر کنید...";

 let credential=null;

 try{
  const identity=await usernameEmail(name);

  if(mode==="register"){
   // Firebase Authentication keeps the generated username email unique.
   // This avoids unauthenticated reads/writes to a public username index.
   credential=await createUserWithEmailAndPassword(
    auth,identity.email,password
   );

   const file=$("photo").files[0];
   myPhoto=file?await compressPhoto(file):"";

  }else{
   credential=await signInWithEmailAndPassword(
    auth,identity.email,password
   );

   const oldProfile=await getDoc(doc(db,"users",credential.user.uid));
   myPhoto=oldProfile.exists()?oldProfile.data().photo||"":"";
  }

  me=credential.user;
  myName=name;
  const profileSnap=await getDoc(doc(db,"users",me.uid));
  const profileData=profileSnap.exists()?profileSnap.data():{};
  if(profileData.banned===true){
   await signOut(auth); me=null;
   throw new Error("این حساب به دلیل تخلف مسدود شده است. برای پیگیری با مالک برنامه تماس بگیرید.");
  }
  myRole=me.uid===OWNER_UID?"owner":(profileData.role||"user");
  const country=await detectCountry();

  await setDoc(doc(db,"users",me.uid),{
   name:myName,
   usernameKey:identity.key,
   photo:myPhoto,
   countryCode:country.countryCode||profileData.countryCode||"",
   countryName:country.countryName||profileData.countryName||"",
   lastSeen:Date.now()
  },{merge:true});

  $("login").style.display="none";
  $("chat").style.display="block";
  $("welcome").textContent="سلام "+myName+" عزیز ❤️ "+countryFlag(country.countryCode||profileData.countryCode||"");
  $("myPhoto").src=myPhoto||"";
  $("myUid").textContent=me.uid;

  startUsers();
  renderAdminPanel();
  openPublic();

  if(heartbeat)clearInterval(heartbeat);
  heartbeat=setInterval(async()=>{
   if(me){
    try{
     await updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()});
    }catch(e){}
   }
  },20000);

 }catch(e){
  let message=e.message||"خطای نامشخص";
  if(e.code==="auth/email-already-in-use")message="این نام کاربری قبلاً ثبت شده است";
  if(e.code==="auth/invalid-credential")message="نام کاربری یا رمز عبور اشتباه است";
  if(e.code==="auth/weak-password")message="رمز عبور باید حداقل ۶ حرف باشد";
  if(e.code==="auth/network-request-failed")message="اتصال اینترنت را بررسی کنید";
  if(e.message&&e.message.includes("مسدود شده"))message=e.message;
  $("error").textContent=message;
 }

 $("enterBtn").disabled=false;
};

function startUsers(){
 if(usersUnsub)usersUnsub();
 usersUnsub=onSnapshot(collection(db,"users"),snap=>{
  allUsers=snap.docs.map(d=>({uid:d.id,...d.data()}));
  renderUsers();
  renderAdminPanel();
 },e=>console.error(e));
}

function renderUsers(){
 const list=$("userList");
 list.innerHTML="";
 const now=Date.now();

 allUsers.forEach(u=>{
  if(!me||u.uid===me.uid)return;
  const online=u.lastSeen&&now-u.lastSeen<65000;
  if(!online)return;

  const btn=document.createElement("button");
  btn.className="user";

  const img=document.createElement("img");
  img.className="avatar";
  img.src=u.photo||"";

  const info=document.createElement("span");
  info.textContent=countryFlag(u.countryCode||"")+" "+u.name+" 🟢 آنلاین";

  btn.append(img,info);
  btn.onclick=()=>showProfile(u);
  list.append(btn);
 });

 if(!list.children.length){
  list.textContent="فعلاً کاربر آنلاین دیگری نیست";
 }
}

let selectedProfile=null;
window.showProfile=function(u){
 selectedProfile=u;
 $("profileCardPhoto").src=u.photo||"";
 $("profileCardName").textContent=u.name||"کاربر";
 $("profileCardUsername").textContent="@"+(u.name||"user");
 const online=u.lastSeen&&Date.now()-u.lastSeen<65000;
 $("profileCardStatus").textContent=online?"🟢 این حساب موجود است — آنلاین":"⚪ این حساب موجود است — آفلاین";
 $("profileCard").style.display="block";
 $("profileCard").scrollIntoView({behavior:"smooth",block:"center"});
};
window.closeProfile=function(){
 $("profileCard").style.display="none";
 selectedProfile=null;
};
window.chatWithProfile=function(){
 if(!selectedProfile)return;
 const u=selectedProfile;
 closeProfile();
 openPrivate(u);
};
function stopMessages(){
 if(messagesUnsub){
  messagesUnsub();
  messagesUnsub=null;
 }
}

window.openPublic=function(){
 activePeer=null;
 $("roomTitle").textContent="💬 گفت‌وگوی عمومی";
 listenMessages("public");
};

window.openPrivate=function(u){
 activePeer=u;
 $("roomTitle").textContent="گفت‌وگوی خصوصی با "+u.name;
 listenMessages("private");
};

function listenMessages(type){
 stopMessages();
 $("messages").innerHTML="در حال دریافت پیام‌ها...";
 let q;

 if(type==="public"){
  q=query(collection(db,"messages"),where("type","==","public"));
 }else{
  q=query(collection(db,"messages"),
   where("members","array-contains",me.uid));
 }

 messagesUnsub=onSnapshot(q,snap=>{
  let arr=snap.docs.map(d=>({id:d.id,...d.data()}));

  if(type==="private"){
   arr=arr.filter(m=>m.members?.includes(activePeer.uid));
  }

  arr.sort((a,b)=>
   (a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0)
  );
  arr=arr.slice(-100);
  renderMessages(arr);
 },e=>{
  $("messages").textContent="خطا در دریافت پیام‌ها: "+e.message;
 });
}

function renderMessages(arr){
 const box=$("messages");
 box.innerHTML="";
 arr.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg"+(m.senderUid===me.uid?" mine":"");

  const name=document.createElement("b");
  name.textContent=m.senderName+": ";

  const body=document.createElement("span");
  body.textContent=m.text;

  div.append(name,body);
  if(canManageUsers()){
   const del=document.createElement("button");
   del.textContent="حذف پیام"; del.style.marginTop="6px";
   del.onclick=()=>removeMessage(m.id); div.append(del);
  }
  box.append(div);
 });
 box.scrollTop=box.scrollHeight;
}

window.sendMessage=async function(){
 const text=$("message").value.trim();
 if(!text||!me)return;

 try{
  const data={
   senderUid:me.uid,
   senderName:myName,
   text:text,
   createdAt:serverTimestamp()
  };

  if(activePeer){
   data.type="private";
   data.members=[me.uid,activePeer.uid];
  }else{
   data.type="public";
  }

  await addDoc(collection(db,"messages"),data);
  $("message").value="";
 }catch(e){
  alert("پیام ارسال نشد: "+e.message);
 }
};

function canManageUsers(){return ["owner","admin"].includes(myRole);}
function roleLabel(role){const labels={owner:"مالک اصلی",admin:"ادمین",manager:"مدیر ناظر",moderator:"ناظم",user:"کاربر"};return labels[role]||"کاربر";}
function allowedRoles(){
 if(myRole==="owner")return ["user","moderator","manager","admin"];
 if(myRole==="admin")return ["user","moderator","manager"];
 if(myRole==="manager")return ["user","moderator"];
 return [];
}
function renderAdminPanel(){
 const panel=$("adminPanel"),list=$("adminUsers"); if(!panel||!list)return;
 panel.style.display=canManageUsers()?"block":"none"; if(!canManageUsers())return;
 list.innerHTML="";
 allUsers.filter(u=>u.uid!==me?.uid).forEach(u=>{
  const row=document.createElement("div");
  row.style.cssText="padding:10px;border-top:1px solid #eee;display:flex;gap:7px;align-items:center;flex-wrap:wrap";
  const label=document.createElement("span");
  label.textContent=(u.name||"بدون نام")+" — "+roleLabel(u.role||"user")+(u.banned?" — مسدود":""); row.append(label);
  const roles=allowedRoles();
  if(roles.length&&u.role!=="owner"){
   const select=document.createElement("select");
   roles.forEach(role=>{const o=document.createElement("option");o.value=role;o.textContent=roleLabel(role);if((u.role||"user")===role)o.selected=true;select.append(o);});
   const save=document.createElement("button");save.textContent="ثبت رتبه";
   save.onclick=async()=>{
    if(myRole!=="owner"&&u.role==="admin")return alert("فقط مالک اصلی می‌تواند رتبه ادمین را تغییر دهد.");
    if(select.value==="admin"&&myRole!=="owner")return alert("فقط مالک اصلی می‌تواند ادمین تعیین کند.");
    try{await updateDoc(doc(db,"users",u.uid),{role:select.value});alert("رتبه تغییر کرد.");}
    catch(e){alert("تغییر رتبه انجام نشد: "+e.message);}
   };row.append(select,save);
  }
  if(myRole!=="moderator"&&!u.banned){
   const ban=document.createElement("button");ban.textContent="اخراج و مسدودسازی";
   ban.onclick=async()=>{if(!confirm("این حساب مسدود شود؟ کاربر دیگر نمی‌تواند وارد چت شود."))return;
    try{await updateDoc(doc(db,"users",u.uid),{banned:true,bannedBy:me.uid,bannedAt:Date.now()});alert("حساب مسدود شد.");}
    catch(e){alert("مسدودسازی انجام نشد: "+e.message);}
   };row.append(ban);
  }
  list.append(row);
 });
}
async function removeMessage(messageId){
 if(myRole==="user")return;if(!confirm("این پیام حذف شود؟"))return;
 try{await deleteDoc(doc(db,"messages",messageId));}
 catch(e){alert("حذف پیام انجام نشد: "+e.message);}
}
window.addEmoji=function(emoji){
 $("message").value+=emoji;
 $("message").focus();
};

window.exitChat=async function(){
 if(heartbeat)clearInterval(heartbeat);
 heartbeat=null;
 stopMessages();

 if(usersUnsub){
  usersUnsub();
  usersUnsub=null;
 }

 if(me){
  try{
   await updateDoc(doc(db,"users",me.uid),{lastSeen:0});
  }catch(e){}
 }

 await signOut(auth);
 me=null;
 activePeer=null;

 $("chat").style.display="none";
 $("login").style.display="block";
 $("message").value="";
 $("password").value="";
};
</script>
</body>
