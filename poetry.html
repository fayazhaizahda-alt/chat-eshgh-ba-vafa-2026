<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتاق شعر | عشق با وفا</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,sans-serif;color:#fff;background:radial-gradient(ellipse at top right,#503078,transparent 45%),linear-gradient(145deg,#17132d,#28143f 55%,#171b37)}
header{padding:22px 14px;text-align:center;background:linear-gradient(110deg,#401477,#59238e 55%,#32105f);border-bottom:3px solid #b879ff;box-shadow:0 5px 22px #0006}
header h1{font-size:clamp(23px,5vw,34px);margin:0}
header p{margin:8px 0 0;color:#f6d8ff}
main{width:min(760px,100%);margin:22px auto;padding:12px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
a,button{font-family:Tahoma;text-decoration:none;border:0;border-radius:22px;padding:11px 17px;background:#7130a8;color:white;font-size:14px}
.poem{margin:16px 0;padding:22px 16px;border-radius:20px;background:linear-gradient(145deg,#43245f,#292044);border:1px solid #a96aff;box-shadow:0 8px 24px #0004;text-align:center}
.poem h2{font-size:20px;color:#ffd5ef;margin:0 0 12px}
.poem p{font-size:17px;line-height:2.4;white-space:pre-line;margin:0;color:#fff}
footer{text-align:center;color:#c9b7dc;font-size:12px;padding:24px}
</style>
</head>
<body>
<header><h1>🌹 اتاق شعر</h1><p>شعرهای زیبا در خانهٔ عشق با وفا ❤️</p></header>
<main>
<div class="actions"><a href="./">← بازگشت به صفحه اصلی چت</a><span>📚 مجموعه شعر</span></div>
<article class="poem"><h2>❤️ عشق باوفا</h2><p>عشق آن نیست که هر روز به زبان آوریم
عشق آن است که در سختی کنارت بمانیم ❤️</p></article>
<article class="poem"><h2>🌸 دلتنگی</h2><p>دلم تنگ است برای لحظه‌های دیدنت
برای خنده‌های شیرین و صدای شنیدنت 🌹</p></article>
</main>
<footer>چت عشق با وفا · اتاق شعر</footer>
</body>
</html>
