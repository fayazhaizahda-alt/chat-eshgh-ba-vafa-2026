<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b315c">
<meta name="description" content="برنامه شعر؛ خواندن شعر و ورود به اتاق چت عشق با وفا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>شعر</title>
<style>
:root{color-scheme:light;--ink:#382536;--pink:#a83d70;--rose:#f7dce8;--cream:#fff9fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 12%,#fff 0 2%,transparent 24%),linear-gradient(145deg,#fbe8ef,#f3eaff 55%,#fff4e9)}
header{text-align:center;padding:42px 18px 24px}
.logo{width:76px;height:76px;margin:auto auto 12px;border-radius:25px;background:linear-gradient(145deg,#c65a89,#81315e);display:grid;place-items:center;color:white;font-size:38px;box-shadow:0 12px 28px #8b315c35}
h1{font-size:32px;margin:8px 0}.sub{color:#805c72;margin:0;font-size:14px}
main{max-width:560px;margin:0 auto;padding:12px 18px 38px}
.choice{display:flex;align-items:center;gap:16px;width:100%;border:1px solid #f0d5e1;background:#fffafc;border-radius:22px;padding:19px;margin:13px 0;text-align:right;color:inherit;text-decoration:none;box-shadow:0 8px 24px #7c345010;cursor:pointer;transition:transform .15s}
.choice:active{transform:scale(.985)}
.symbol{width:58px;height:58px;flex:0 0 58px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:#f9e1eb}
.choice h2{font-size:18px;margin:0 0 7px}.choice p{font-size:12px;color:#8b7180;margin:0;line-height:1.8}
.arrow{margin-right:auto;color:#a45c7d;font-size:23px}
.panel{display:none;margin-top:22px;padding:20px;background:#fffafc;border:1px solid #f0d5e1;border-radius:22px;box-shadow:0 8px 24px #7c345010}
.panel.show{display:block}.panel h2{margin:0 0 10px;font-size:20px}
.category-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;margin:4px 0 10px;scrollbar-width:thin}.category{flex:0 0 auto;border:1px solid #efcbdc;border-radius:999px;background:#fff;color:#80506a;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.category.active{background:#a83d70;color:#fff;border-color:#a83d70}.poem{background:#fff;border:1px solid #f1dce6;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 5px 16px #7c34500b}.poem h3{font-size:16px;margin:0 0 12px;color:#8b315c}.poem p{white-space:pre-line;line-height:2.15;font-size:15px;margin:0 0 13px}.like{border:1px solid #efcbdc;border-radius:999px;background:#fff6fa;color:#963e69;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}.like.liked{background:#a83d70;color:white;border-color:#a83d70}.note{font-size:11px;color:#947d89;text-align:center;line-height:1.8;margin-top:14px}
footer{text-align:center;color:#987f8d;font-size:11px;padding:16px}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">🌹</div>
  <h1>شعر</h1>
  <p class="sub">دنیایی برای شعر و دوستی</p>
</header>
<main>
  <a class="choice" href="../" aria-label="ورود به اتاق چت عشق با وفا">
    <div class="symbol">💬</div>
    <div><h2>اتاق چت عشق با وفا</h2><p>برای گفت‌وگو وارد چت شوید</p></div>
    <span class="arrow">‹</span>
  </a>
  <button class="choice" id="poetryButton" type="button" aria-expanded="false" aria-controls="poetryPanel">
    <div class="symbol">📖</div>
    <div><h2>بخش شعر</h2><p>خواندن شعرها و پسندیدن شعرهای دلخواه</p></div>
    <span class="arrow">‹</span>
  </button>
  <section class="panel" id="poetryPanel">
    <h2>🌷 گنجینه شعر</h2>
    <div class="category-tabs" id="categoryTabs" aria-label="دسته‌بندی شعرها">
      <button type="button" class="category active" data-category="all">همه شعرها</button>
      <button type="button" class="category" data-category="romantic">❤️ عاشقانه</button>
      <button type="button" class="category" data-category="longing">🥀 دلتنگی</button>
      <button type="button" class="category" data-category="loyalty">🤍 وفاداری</button>
      <button type="button" class="category" data-category="betrayal">💔 بی‌وفایی</button>
      <button type="button" class="category" data-category="hope">🌱 امید</button>
    </div>
    <div id="poemList"></div><p class="note">شعرها بدون نام نویسنده نمایش داده می‌شوند. پسندها فعلاً فقط روی همین دستگاه ذخیره می‌شوند.</p>
  </section>
</main>
<footer>با مهر و عشق 🌹</footer>
<script>
const button=document.getElementById('poetryButton');
const panel=document.getElementById('poetryPanel');
const poems=[
{id:'p1',title:'به یاد تو',body:'شب از خیال چشم تو روشن شده هنوز\nاین قلب خسته با غم تو خو گرفته است\nهر جا که می‌روم، دل من سمت تو رود\nانگار راه خانهٔ من رو به تو گرفته است',category:'longing'},
{id:'p2',title:'وفا',body:'وفا چراغ خانهٔ دل‌های روشن است\nدر روزگار سرد، پناهی برای ماست\nآن‌کس که با محبت خود عهد می‌کند\nدر قلب دوستان، همیشه عزیز و آشناست',category:'loyalty'},
{id:'p3',title:'آرامش دل',body:'گاهی سکوت، حرف دل آدمی شود\nگاهی نگاه، قصهٔ ناگفته می‌شود\nیک قلب پاک اگرچه تنها بماند باز\nبا مهر، روشنایی این جاده می‌شود',category:'hope'},
{id:'p4',title:'چراغ امید',body:'اگرچه راه زندگی پر ز پیچ و خم شود\nچراغ آرزو درون سینه روشن است\nبه هر کجا که باد غم وزید و خسته‌ام نمود\nامید، دست مهربان و تکیه‌گاه من است',category:'hope'},
{id:'p5',title:'دل مهربان',body:'دلی که مهر می‌ورزد، بهار جاودان دارد\nمیان لحظه‌های سخت، لبخند و امان دارد\nنه با زر و نه با نام، کسی عزیز دل گردد\nکسی که رسم وفا داند، همیشه جایگاه دارد',category:'loyalty'}
 ,
{id:'p6',title:'عشق باوفا',body:'عشق آن نیست که هر روز به زبان آوریم\nعشق آن است که در سختی کنارت بمانیم ❤️',category:'romantic'},
{id:'p7',title:'دلتنگی',body:'دلم تنگ است برای لحظه‌های دیدنت\nبرای خنده‌های شیرین و صدای شنیدنت 🌹',category:'longing'}
,
{id:'p8',title:'تو در قلب منی',body:'میان شلوغی دنیا تو آرام جان منی\nچراغ روشن شب‌های بی‌نشان منی\nاگر هزار بهار از کنار من بگذرد\nهمیشه تازه‌ترین گل در آسمان منی ❤️',category:'romantic'},
{id:'p9',title:'قرار عاشقی',body:'دلم به بودن تو خو گرفته است\nبه خنده‌های تو دل سپرده است\nکنار تو غم از دلم سفر کند\nکه عشق تو به قلبم جان داده است 🌹',category:'romantic'},
{id:'p10',title:'آغوش خیال',body:'وقتی که دوری، خاطرت نزدیک من است\nنام قشنگت ورد هر آهنگ من است\nهر شب به یادت چشم‌هایم خیره می‌ماند\nعشق تو زیباترین دلتنگی من است',category:'longing'},
{id:'p11',title:'تا همیشه',body:'نه وعدهٔ بی‌پایه می‌خواهم، نه حرفی بی‌وفا\nفقط دلی پاک و مهربان، پر از مهر و صفا\nاگر کنارم بمانی در فراز و در نشیب\nبا عشق می‌سازیم فردایی پر از نور و وفا 💕',category:'loyalty'},
{id:'p12',title:'لبخند تو',body:'لبخند تو بهار دل خستهٔ من است\nصدای تو ترانهٔ آهستهٔ من است\nهر جا که باشم و هر لحظه در سفر\nیاد تو بهترین هم‌نفس من است 🌷',category:'romantic'}
,
{id:'p13',title:'اشک‌های بی‌صدا',body:'به پای عهد تو دل را صبور نگه داشتم\nولی تو رفتی و من خاطره‌ها نگه داشتم\nچه سخت می‌شود باور کنی کسی که دوستش داشتی\nتمام عشق تو را ساده پشت سر گذاشت 💔',category:'betrayal'},
{id:'p14',title:'قول شکسته',body:'گفتی که می‌مانی، اما نماندی\nدر فصل سختی دستم را نخواندی\nمن ماندم و یک قلب پر از سؤال\nتو رفتی و عهد دلت را شکاندی',category:'betrayal'}
];
const storageKey='shear-liked-poems-v1';
function getLikes(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){return {}}}
let activeCategory='all';
function renderPoems(){
 const likes=getLikes();
 document.querySelectorAll('.category').forEach(btn=>btn.classList.toggle('active',btn.dataset.category===activeCategory));
 const shown=activeCategory==='all'?poems:poems.filter(poem=>poem.category===activeCategory);
 document.getElementById('poemList').innerHTML=shown.length?shown.map(poem=>{
  const liked=!!likes[poem.id];
  return '<article class="poem"><h3>🌷 '+poem.title+'</h3><p>'+poem.body+'</p><button class="like '+(liked?'liked':'')+'" type="button" data-id="'+poem.id+'" aria-pressed="'+liked+'">'+(liked?'♥ پسندیده شد':'♡ پسندیدن')+'</button></article>';
 }).join(''):'<p class="note">هنوز شعری در این بخش نیست.</p>';
 document.querySelectorAll('.like').forEach(btn=>btn.addEventListener('click',()=>{
  const current=getLikes();const id=btn.dataset.id;
  if(current[id]) delete current[id]; else current[id]=true;
  localStorage.setItem(storageKey,JSON.stringify(current));renderPoems();
 }));
}
document.querySelectorAll('.category').forEach(btn=>btn.addEventListener('click',()=>{
 activeCategory=btn.dataset.category;renderPoems();
}));
renderPoems();
button.addEventListener('click',()=>{
  const opened=panel.classList.toggle('show');
  button.setAttribute('aria-expanded',String(opened));
  if(opened) panel.scrollIntoView({behavior:'smooth',block:'start'});
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
