<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b315c">
<meta name="description" content="برنامه شعر؛ خواندن شعر و ورود به اتاق چت عشق با وفا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>شعر</title>
<style>
:root{color-scheme:light;--ink:#382536;--pink:#a83d70;--rose:#f7dce8;--cream:#fff9fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 12%,#fff 0 2%,transparent 24%),linear-gradient(145deg,#fbe8ef,#f3eaff 55%,#fff4e9)}
header{text-align:center;padding:42px 18px 24px}
.logo{width:76px;height:76px;margin:auto auto 12px;border-radius:25px;background:linear-gradient(145deg,#c65a89,#81315e);display:grid;place-items:center;color:white;font-size:38px;box-shadow:0 12px 28px #8b315c35}
h1{font-size:32px;margin:8px 0}.sub{color:#805c72;margin:0;font-size:14px}
main{max-width:560px;margin:0 auto;padding:12px 18px 38px}
.choice{display:flex;align-items:center;gap:16px;width:100%;border:1px solid #f0d5e1;background:#fffafc;border-radius:22px;padding:19px;margin:13px 0;text-align:right;color:inherit;text-decoration:none;box-shadow:0 8px 24px #7c345010;cursor:pointer;transition:transform .15s}
.choice:active{transform:scale(.985)}
.symbol{width:58px;height:58px;flex:0 0 58px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:#f9e1eb}
.choice h2{font-size:18px;margin:0 0 7px}.choice p{font-size:12px;color:#8b7180;margin:0;line-height:1.8}
.arrow{margin-right:auto;color:#a45c7d;font-size:23px}
.panel{display:none;margin-top:22px;padding:20px;background:#fffafc;border:1px solid #f0d5e1;border-radius:22px;box-shadow:0 8px 24px #7c345010}
.panel.show{display:block}.panel h2{margin:0 0 10px;font-size:20px}
.category-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;margin:4px 0 10px;scrollbar-width:thin}.category{flex:0 0 auto;border:1px solid #efcbdc;border-radius:999px;background:#fff;color:#80506a;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.category.active{background:#a83d70;color:#fff;border-color:#a83d70}.poem{background:#fff;border:1px solid #f1dce6;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 5px 16px #7c34500b}.poem h3{font-size:16px;margin:0 0 12px;color:#8b315c}.poem p{white-space:pre-line;line-height:2.15;font-size:15px;margin:0 0 13px}.like{border:1px solid #efcbdc;border-radius:999px;background:#fff6fa;color:#963e69;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}.like.liked{background:#a83d70;color:white;border-color:#a83d70}.note{font-size:11px;color:#947d89;text-align:center;line-height:1.8;margin-top:14px}
footer{text-align:center;color:#987f8d;font-size:11px;padding:16px}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">🌹</div>
  <h1>شعر</h1>
  <p class="sub">دنیایی برای شعر و دوستی</p>
</header>
<main>
  <a class="choice" href="../" aria-label="ورود به اتاق چت عشق با وفا">
    <div class="symbol">💬</div>
    <div><h2>اتاق چت عشق با وفا</h2><p>برای گفت‌وگو وارد چت شوید</p></div>
    <span class="arrow">‹</span>
  </a>
  <button class="choice" id="poetryButton" type="button" aria-expanded="false" aria-controls="poetryPanel">
    <div class="symbol">📖</div>
    <div><h2>بخش شعر</h2><p>خواندن شعرها و پسندیدن شعرهای دلخواه</p></div>
    <span class="arrow">‹</span>
  </button>
  <section class="panel" id="poetryPanel">
    <h2>🌷 گنجینه شعر</h2>
    <div class="category-tabs" id="categoryTabs" aria-label="دسته‌بندی شعرها">
      <button type="button" class="category active" data-category="all">همه شعرها</button>
      <button type="button" class="category" data-category="romantic">❤️ عاشقانه</button>
      <button type="button" class="category" data-category="longing">🥀 دلتنگی</button>
      <button type="button" class="category" data-category="loyalty">🤍 وفاداری</button>
      <button type="button" class="category" data-category="betrayal">💔 بی‌وفایی</button>
      <button type="button" class="category" data-category="hope">🌱 امید</button>
    </div>
    <div id="poemList"></div><p class="note">شعرها بدون نام نویسنده نمایش داده می‌شوند. پسندها فعلاً فقط روی همین دستگاه ذخیره می‌شوند.</p>
  </section>
</main>
<footer>با مهر و عشق 🌹</footer>
<script>
const button=document.getElementById('poetryButton');
const panel=document.getElementById('poetryPanel');
const poems=[
{id:'p1',title:'به یاد تو',body:'شب از خیال چشم تو روشن شده هنوز\nاین قلب خسته با غم تو خو گرفته است\nهر جا که می‌روم، دل من سمت تو رود\nانگار راه خانهٔ من رو به تو گرفته است',category:'longing'},
{id:'p2',title:'وفا',body:'وفا چراغ خانهٔ دل‌های روشن است\nدر روزگار سرد، پناهی برای ماست\nآن‌کس که با محبت خود عهد می‌کند\nدر قلب دوستان، همیشه عزیز و آشناست',category:'loyalty'},
{id:'p3',title:'آرامش دل',body:'گاهی سکوت، حرف دل آدمی شود\nگاهی نگاه، قصهٔ ناگفته می‌شود\nیک قلب پاک اگرچه تنها بماند باز\nبا مهر، روشنایی این جاده می‌شود',category:'hope'},
{id:'p4',title:'چراغ امید',body:'اگرچه راه زندگی پر ز پیچ و خم شود\nچراغ آرزو درون سینه روشن است\nبه هر کجا که باد غم وزید و خسته‌ام نمود\nامید، دست مهربان و تکیه‌گاه من است',category:'hope'},
{id:'p5',title:'دل مهربان',body:'دلی که مهر می‌ورزد، بهار جاودان دارد\nمیان لحظه‌های سخت، لبخند و امان دارد\nنه با زر و نه با نام، کسی عزیز دل گردد\nکسی که رسم وفا داند، همیشه جایگاه دارد',category:'loyalty'}
 ,
{id:'p6',title:'عشق باوفا',body:'عشق آن نیست که هر روز به زبان آوریم\nعشق آن است که در سختی کنارت بمانیم ❤️',category:'romantic'},
{id:'p7',title:'دلتنگی',body:'دلم تنگ است برای لحظه‌های دیدنت\nبرای خنده‌های شیرین و صدای شنیدنت 🌹',category:'longing'}
,
{id:'p8',title:'تو در قلب منی',body:'میان شلوغی دنیا تو آرام جان منی\nچراغ روشن شب‌های بی‌نشان منی\nاگر هزار بهار از کنار من بگذرد\nهمیشه تازه‌ترین گل در آسمان منی ❤️',category:'romantic'},
{id:'p9',title:'قرار عاشقی',body:'دلم به بودن تو خو گرفته است\nبه خنده‌های تو دل سپرده است\nکنار تو غم از دلم سفر کند\nکه عشق تو به قلبم جان داده است 🌹',category:'romantic'},
{id:'p10',title:'آغوش خیال',body:'وقتی که دوری، خاطرت نزدیک من است\nنام قشنگت ورد هر آهنگ من است\nهر شب به یادت چشم‌هایم خیره می‌ماند\nعشق تو زیباترین دلتنگی من است',category:'longing'},
{id:'p11',title:'تا همیشه',body:'نه وعدهٔ بی‌پایه می‌خواهم، نه حرفی بی‌وفا\nفقط دلی پاک و مهربان، پر از مهر و صفا\nاگر کنارم بمانی در فراز و در نشیب\nبا عشق می‌سازیم فردایی پر از نور و وفا 💕',category:'loyalty'},
{id:'p12',title:'لبخند تو',body:'لبخند تو بهار دل خستهٔ من است\nصدای تو ترانهٔ آهستهٔ من است\nهر جا که باشم و هر لحظه در سفر\nیاد تو بهترین هم‌نفس من است 🌷',category:'romantic'}
,
{id:'p13',title:'اشک‌های بی‌صدا',body:'به پای عهد تو دل را صبور نگه داشتم\nولی تو رفتی و من خاطره‌ها نگه داشتم\nچه سخت می‌شود باور کنی کسی که دوستش داشتی\nتمام عشق تو را ساده پشت سر گذاشت 💔',category:'betrayal'},
{id:'p14',title:'قول شکسته',body:'گفتی که می‌مانی، اما نماندی\nدر فصل سختی دستم را نخواندی\nمن ماندم و یک قلب پر از سؤال\nتو رفتی و عهد دلت را شکاندی',category:'betrayal'}
,
{id:'p15',title:'راز لبخند',body:'لبخند تو آرامش جان خستهٔ من است\nنام تو شیرین‌ترین آواز هر روز من است\nبا تو حتی لحظه‌های ساده زیبا می‌شوند ❤️',category:'romantic'},
{id:'p16',title:'بهانهٔ عشق',body:'هر صبح به عشق دیدنت بیدار می‌شوم\nبا یاد مهربانی تو سرشار می‌شوم\nتو باشی، از غم دنیا رها می‌شوم',category:'romantic'},
{id:'p17',title:'گل آرزو',body:'تو مثل گل به باغ دل من شکفته‌ای\nدر فصل سرد زندگی‌ام تو گفته‌ای\nکه عشق می‌تواند دوباره بهار شود 🌷',category:'romantic'},
{id:'p18',title:'همراه من',body:'اگر مسیر زندگی پر از غبار شود\nاگر دلم ز خستگی بی‌قرار شود\nدستت پناه لحظه‌های دشوار من است',category:'romantic'},
{id:'p19',title:'عطر حضور',body:'عطر حضورت در هوای خانه مانده است\nیاد نگاهت در دل دیوانه مانده است\nعشق تو در جانم نشانه مانده است',category:'romantic'},
{id:'p20',title:'دوستت دارم',body:'دوستت دارم نه فقط برای زیبایی‌ات\nبرای صداقت و دل دریایی‌ات\nبرای همان قلب پر از مهربانی‌ات',category:'romantic'},
{id:'p21',title:'قصهٔ ما',body:'قصهٔ ما با یک نگاه آغاز شد\nدر قلب من یک باغ گل آواز شد\nهر روز با عشق تو زیباترین راز شد',category:'romantic'},
{id:'p22',title:'ستارهٔ من',body:'شب که می‌آید نام تو را زمزمه دارم\nدر آسمان خیال، هزار ستاره دارم\nاما فقط به نور چشم تو علاقه دارم ✨',category:'romantic'},
{id:'p23',title:'نزدیک‌تر از نفس',body:'تو از نفس به جان من نزدیک‌تری\nاز هر خیال و آرزو دلپذیرتری\nدر دفتر قلبم همیشه بهترین‌تری',category:'romantic'},
{id:'p24',title:'قرار دل',body:'قرار دل من صدای خندهٔ توست\nتمام آرزویم دیدن چهرهٔ توست\nبهار خانه‌ام از مهر سادهٔ توست',category:'romantic'},
{id:'p25',title:'باران محبت',body:'باران اگر ببارد و دنیا خیس شود\nبا مهر تو دل از غصه‌ها رها شود\nهر قطره نام عشق تو را زمزمه کند',category:'romantic'},
{id:'p26',title:'آسمان دو نفره',body:'بیا به آسمان آرزو سفر کنیم\nکنار هم غم زمانه را بدر کنیم\nبا دست مهر، خانه‌ای از عشق بنا کنیم',category:'romantic'},
{id:'p27',title:'قلب روشن',body:'قلبم به نام پاک تو روشن شده هنوز\nدر سینه‌ام صدای تو گلشن شده هنوز\nعشق تو در وجود من ایمن شده هنوز',category:'romantic'},
{id:'p28',title:'یک نگاه',body:'یک نگاه تو برایم هزار معنا داشت\nبرای خستگی‌هایم عطر فردا داشت\nدلم کنار تو چه رؤیای زیبا داشت',category:'romantic'},
{id:'p29',title:'بهار چشمانت',body:'بهار از چشم‌های مهربانت می‌رسد\nترانه از لب خندان و جانت می‌رسد\nامید به قلب خسته از نگاهت می‌رسد',category:'romantic'},
{id:'p30',title:'تا کنار تو',body:'می‌خواهم از این راه پر از مهر بگذرم\nبا شوق، از کنار تو هر روز بگذرم\nتا آخرین نفس به هوایت بگذرم',category:'romantic'},
{id:'p31',title:'پنجرهٔ انتظار',body:'هر شب کنار پنجره چشم‌انتظارم\nاز دوری تو با خاطراتت بی‌قرارم\nجز یاد تو چیزی در این دل ندارم 🥀',category:'longing'},
{id:'p32',title:'جای خالی',body:'جای خالی تو در این خانه پیداست\nصدای خنده‌هایت در خیالم آشناست\nدلم هنوز در انتظار قدم‌هایت است',category:'longing'},
{id:'p33',title:'شب بی‌تو',body:'شب بی‌تو دراز است و دلم بی‌قرار\nستاره نمی‌تابد به چشم انتظار\nکاش از راه برسی، ای بهار',category:'longing'},
{id:'p34',title:'کوچهٔ خاطره',body:'از کوچه‌ای که با تو می‌رفتم گذشتم\nبا هر قدم به یاد لبخندت نشستم\nدلتنگ روزهای روشن تو هستم',category:'longing'},
{id:'p35',title:'صدای دور',body:'صدایت از خیالم دور نمی‌شود\nاین بغض خسته از دلم عبور نمی‌شود\nدل بی‌قرارم از تو صبور نمی‌شود',category:'longing'},
{id:'p36',title:'نامهٔ نانوشته',body:'برای تو هزار نامه در دل نوشته‌ام\nولی همه را در سکوت نگه داشته‌ام\nدلتنگی‌ام را با ستاره گفته‌ام',category:'longing'},
{id:'p37',title:'فاصله',body:'فاصله میان ما اگرچه بسیار است\nیاد تو در قلب من همیشه بیدار است\nاین دل به دیدار دوباره امیدوار است',category:'longing'},
{id:'p38',title:'یاد آخرین دیدار',body:'هنوز آن لحظه در یادم مانده است\nنگاه آخر تو در فریادم مانده است\nدلم در حسرت دیدارت نشسته است',category:'longing'},
{id:'p39',title:'باران دلتنگی',body:'باران که می‌بارد تو را یاد می‌کنم\nبا هر قطره قصه‌ای از تو روایت می‌کنم\nدر خلوت شب نام تو را صدا می‌کنم',category:'longing'},
{id:'p40',title:'عکس قدیمی',body:'به عکس کهنه‌ات آرام نگاه می‌کنم\nبا خاطرات رفته‌ات صبح و شام می‌کنم\nدلتنگی‌ام را پشت لبخند پنهان می‌کنم',category:'longing'},
{id:'p41',title:'بی‌خبر',body:'روزها گذشت و از تو خبری نرسید\nبه گوش خسته‌ام صدای آشنایی نرسید\nبه این دل منتظر پیام آشنایی نرسید',category:'longing'},
{id:'p42',title:'مسافر دور',body:'ای مسافر دور، دلم خانهٔ توست\nهر راهی که می‌روم نشانهٔ توست\nاین چشم خسته در انتظار دیدار توست',category:'longing'},
{id:'p43',title:'ساعت خاموش',body:'ساعت به وقت دلتنگی‌ام ایستاده است\nدل در هوای دیدنت دل‌سپرده است\nشب در سکوت نام تو را آورده است',category:'longing'},
{id:'p44',title:'عطر خاطره',body:'عطر خاطره‌ات در اتاقم مانده\nشوق دیدارت در نگاه من مانده\nیک دنیا حرف در دل خاموشم مانده',category:'longing'},
{id:'p45',title:'آخرین پیام',body:'آخرین پیامت هنوز در گوشی من است\nهر واژه‌اش چراغ خاموشی من است\nدلتنگی‌ام از همان لحظه فزونی گرفت',category:'longing'},
{id:'p46',title:'راه بازگشت',body:'اگر روزی گذرت به خانهٔ ما افتاد\nببین که شوق دیدارت هنوز اینجا ایستاد\nدلم برای آمدنت دعاها خواند',category:'longing'},
{id:'p47',title:'چشم به راه',body:'چشمم به راه آمدن صبح دیدار است\nقلبم پر از آرزوی لحظهٔ دیدار است\nاین انتظار با نام تو چه ماندگار است',category:'longing'},
{id:'p48',title:'پیمان پاک',body:'وفا یعنی در سختی رفیق هم بمانیم\nنه تنها وقت شادی کنار هم بخوانیم\nبه عهد روشن دل تا آخر بمانیم 🤍',category:'loyalty'},
{id:'p49',title:'قول مردانه',body:'قول اگر از دل پاک برآید، گران‌بهاست\nوفا در عمل است، نه در حرف و ادعاست\nدل باوفا همیشه سزاوار احترام است',category:'loyalty'},
{id:'p50',title:'رفیق روز سخت',body:'رفیق آن است که در طوفان بماند\nکنار خسته‌دل با مهربانی بماند\nنه آن‌که با نخستین باد از راه بماند',category:'loyalty'},
{id:'p51',title:'دل امین',body:'دل امین رازها را پاس می‌دارد\nبه عهد دوستی حرمت می‌گذارد\nمحبت را به آسانی نمی‌فروشد',category:'loyalty'},
{id:'p52',title:'وفای همیشگی',body:'اگر زمانه رنگ دیگر بگیرد\nاگر مسیر زندگی سختی بگیرد\nدل باوفا همان محبت را بگیرد',category:'loyalty'},
{id:'p53',title:'دست رفاقت',body:'دستی که روز سختی دستت را گرفت\nاز صد سخن به قلب تو نزدیک‌تر گرفت\nقدر چنین همراهی را باید شناخت',category:'loyalty'},
{id:'p54',title:'عهد دل',body:'عهد دل را با طلا نمی‌توان سنجید\nبا رفتار نیک و صداقت باید فهمید\nوفا را در روزگار سخت باید دید',category:'loyalty'},
{id:'p55',title:'محبت بی‌منت',body:'محبت اگر ز دل باشد، حسابی ندارد\nبرای نیکی کردن انتظاری ندارد\nدل باوفا جز مهر و یاری ندارد',category:'loyalty'},
{id:'p56',title:'پشت و پناه',body:'در روزگار سخت تو پشتم شدی\nبا مهر خود چراغ راهم شدی\nدر دفتر قلبم همیشه همراهم شدی',category:'loyalty'},
{id:'p57',title:'دوست واقعی',body:'دوست واقعی به ظاهر نمی‌نگرد\nدر لحظهٔ نیاز، دوست را وا نمی‌گذارد\nبا قلب پاک، ریشهٔ مهر می‌کارد',category:'loyalty'},
{id:'p58',title:'حرمت عهد',body:'حرمت عهد را به دل نگه داریم\nدر دوستی راه صدق و صفا سپاریم\nبا مهر، غبار کدورت را برداریم',category:'loyalty'},
{id:'p59',title:'چراغ اعتماد',body:'اعتماد مثل چراغی در شب است\nبا صداقت روشن و با دروغ خسته است\nوفاداری نگهبان این خانه است',category:'loyalty'},
{id:'p60',title:'همراه وفادار',body:'همراه وفادار در راه نمی‌ماند\nدر سختی از کنار یارش نمی‌راند\nبا مهر، امید تازه می‌نشاند',category:'loyalty'},
{id:'p61',title:'دل و پیمان',body:'دل و پیمان را به بازی نسپاریم\nبا حرف شیرین دل کسی را نیازاریم\nبه عهدی که بستیم وفادار بمانیم',category:'loyalty'},
{id:'p62',title:'مهر بی‌پایان',body:'مهر تو در قلب من ماندگار است\nیاد وفاداری‌ات افتخار است\nاین دوستی از هر گنجی گران‌بهاتر است',category:'loyalty'},
{id:'p63',title:'صداقت',body:'صداقت راه روشن دوستی است\nوفا زیباترین رسم زندگی است\nدل پاک از هر چه باشد باارزش‌تر است',category:'loyalty'},
{id:'p64',title:'تا پای جان',body:'اگرچه راه پر از سنگ و خار باشد\nدل باوفا همیشه استوار باشد\nکنار یار خود تا پایان بماند',category:'loyalty'},
{id:'p65',title:'خاکستر اعتماد',body:'اعتمادم را به دست تو سپردم\nاز نگاهت قصهٔ فردا را خواندم\nتو شکستی آنچه با عشق پروردم 💔',category:'betrayal'},
{id:'p66',title:'وعدهٔ پوچ',body:'چه آسان گفتی که تا آخر می‌مانی\nچه آسان رفتی و دل را شکاندی\nچه سخت است باور این بی‌وفایی',category:'betrayal'},
{id:'p67',title:'دل شکسته',body:'دلم شکست و صدایش را کسی نشنید\nاشک من از چشم خسته‌ام چکید\nآن‌که باید می‌ماند، از کنارم پرید',category:'betrayal'},
{id:'p68',title:'پشت نقاب',body:'پشت لبخندت هزاران راز پنهان بود\nحرف‌هایت گرم و قلبت سرد و لرزان بود\nوفای تو فقط یک قصهٔ آسان بود',category:'betrayal'},
{id:'p69',title:'آخرین اعتماد',body:'آخرین اعتمادم را به تو بخشیدم\nتمام آرزوهایم را به تو دیدم\nولی در انتها تنهایی را چشیدم',category:'betrayal'},
{id:'p70',title:'دل بی‌پناه',body:'به تو پناه آوردم و تنها شدم\nدر ازدحام خاطره رسوا شدم\nاز وعده‌های تو خسته و شیدا شدم',category:'betrayal'},
{id:'p71',title:'حرف‌های ناتمام',body:'حرف‌های ناتمام در سینه‌ام ماند\nقصهٔ رفتنت بر شانه‌ام ماند\nاز تو فقط خاطره‌ای سرد به جا ماند',category:'betrayal'},
{id:'p72',title:'آینهٔ شکسته',body:'آینهٔ اعتمادم از دست تو شکست\nتصویر مهربانی در آن برای همیشه نشست\nاما دل ساده‌ام دیگر به وعده نبست',category:'betrayal'},
{id:'p73',title:'بی‌اعتنا',body:'من با تمام قلبم به تو نگاه کردم\nتو بی‌تفاوت از کنارم عبور کردی\nمن ماندم و سکوتی که باورش سخت بود',category:'betrayal'},
{id:'p74',title:'بهای دروغ',body:'دروغت گل امیدم را پرپر کرد\nسکوتت خانهٔ دلم را بی‌در کرد\nبی‌وفایی‌ات مرا از رؤیا جدا کرد',category:'betrayal'},
{id:'p75',title:'رد پا',body:'رد پای رفتنت هنوز در دل من است\nخاطرهٔ خنده‌ات کنار غم من است\nاما دیگر جای تو در راه من نیست',category:'betrayal'},
{id:'p76',title:'شب جدایی',body:'شب جدایی چه آرام و تلخ گذشت\nتمام آرزوهایم از نگاهم گذشت\nدل از امید دیدار تو آهسته گذشت',category:'betrayal'},
{id:'p77',title:'قول فراموش‌شده',body:'گفتی که نامم را از یاد نمی‌بری\nگفتی که قلبم را تنها نمی‌گذاری\nاما نخستین کسی بودی که رفتی',category:'betrayal'},
{id:'p78',title:'پایان قصه',body:'قصه به پایان رسید و تو رفتی\nبا خاطراتی تلخ و خاموش رفتی\nمن از میان درد، دوباره برخاستم',category:'betrayal'},
{id:'p79',title:'زخم پنهان',body:'زخم زبانت در سکوت پنهان شد\nلبخند بر لبم ولی دل پریشان شد\nاز آن همه مهر، سهم من هجران شد',category:'betrayal'},
{id:'p80',title:'دیگر باور ندارم',body:'دیگر به هر وعده دل نمی‌بندم\nراز دلم را به هر کسی نمی‌سپارم\nاز تجربه آموختم و آرام می‌مانم',category:'betrayal'},
{id:'p81',title:'گل پژمرده',body:'گلی که با دروغ آبش دادی پژمرد\nدل که با بی‌وفایی آزرده شد، افسرد\nاما بهار تازه از راه خواهد رسید',category:'betrayal'},
{id:'p82',title:'رفتن بی‌خداحافظی',body:'رفتی و حتی فرصت بدرود ندادی\nبه قلب خسته‌ام مجال پرسش ندادی\nبا رفتنت هزار حرف ناگفته نهادی',category:'betrayal'},
{id:'p101',title:'رفاقت تلخ',body:'رفاقت قصه ایی تلخ است از نامش گریزانم\nبه نامردان نکن مردی که من کردم پشیمانم 💔',category:'betrayal'},
{id:'p83',title:'صبح روشن',body:'پس از شب سیاه، سپیده می‌رسد\nبه قلب خسته امید تازه می‌رسد\nبرای هر غمی روزی پایان می‌رسد 🌱',category:'hope'},
{id:'p84',title:'فردای بهتر',body:'اگر امروز راه دشوار و تاریک است\nبدان که پشت ابرها خورشید نزدیک است\nفردا برای قلب امیدوار روشن است',category:'hope'},
{id:'p85',title:'دوباره برخیز',body:'اگر زمین خوردی، دوباره برخیز\nبه روی زخم روزگار لبخند بریز\nهنوز هزار راه روشن پیش رو داری',category:'hope'},
{id:'p86',title:'چراغ فردا',body:'چراغ امید را خاموش مکن\nدر برابر سختی‌ها زانو مکن\nبه فردای روشن دل خوش کن',category:'hope'},
{id:'p87',title:'بهار پس از زمستان',body:'زمستان هر قدر طولانی بماند\nبهار از راه خود روزی می‌آید\nدرخت آرزو دوباره گل می‌دهد',category:'hope'},
{id:'p88',title:'دل قوی دار',body:'دل قوی دار، ای مسافر خسته\nهنوز درهای تازه‌ای به رویت بسته نیست\nخدا برای هر شب، صبحی آفریده است',category:'hope'},
{id:'p89',title:'راه تازه',body:'هر پایان می‌تواند آغاز باشد\nهر اشک می‌تواند راز پرواز باشد\nبه قلبت فرصت یک روز تازه بده',category:'hope'},
{id:'p90',title:'آفتاب امید',body:'اگرچه ابر غم آسمان را پوشاند\nنور امید در دل تو جاودان ماند\nصبح روشن از پشت کوه برخاست',category:'hope'},
{id:'p91',title:'قدم کوچک',body:'قدم کوچک امروز را بردار\nبه فردای روشن امیدوار باش\nراه بلند با گام نخست آغاز می‌شود',category:'hope'},
{id:'p92',title:'پس از باران',body:'پس از باران، هوا روشن‌تر است\nپس از سختی، دل نیرومندتر است\nبرای امید همیشه فرصتی هست',category:'hope'},
{id:'p93',title:'آرزوهای سبز',body:'آرزوهای سبزت را زنده نگه دار\nبه صدای ناامیدی گوش نسپار\nدرخت رویا با صبر میوه می‌دهد',category:'hope'},
{id:'p94',title:'آسمان آبی',body:'اگر امروز آسمانت ابری است\nبدان که آفتاب پشت آن جاری است\nدل امیدوار همیشه بهاری است',category:'hope'},
{id:'p95',title:'هنوز فرصت هست',body:'هنوز برای شروع دیر نیست\nهنوز در قلبت چراغی کم‌فروغ نیست\nباور کن که راه بسته نیست',category:'hope'},
{id:'p96',title:'لبخند دوباره',body:'یک لبخند تازه به فردا هدیه کن\nدل خسته را با امید آشنا کن\nاز نو بساز آنچه زمانه شکست',category:'hope'},
{id:'p97',title:'توان برخاستن',body:'درون تو نیروی برخاستن هست\nپس از هر شکست راه ساختن هست\nبه خودت ایمان داشته باش',category:'hope'},
{id:'p98',title:'ستارهٔ راه',body:'در تاریکی شب ستاره‌ای هست\nبرای هر دل خسته چاره‌ای هست\nبه راهت ادامه بده، سپیده‌ای هست',category:'hope'},
{id:'p99',title:'صبر شیرین',body:'صبر کن، گل در زمان خود می‌شکفد\nنور از دل تاریکی پیدا می‌شود\nدل امیدوار به مقصد می‌رسد',category:'hope'},
{id:'p100',title:'فصل نو',body:'برگ‌های خسته دوباره سبز می‌شوند\nآرزوهای خاموش دوباره زنده می‌شوند\nبا امید، روزهای نو از راه می‌رسند',category:'hope'}
];
const storageKey='shear-liked-poems-v1';
function getLikes(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){return {}}}
let activeCategory='all';
function renderPoems(){
 const likes=getLikes();
 document.querySelectorAll('.category').forEach(btn=>btn.classList.toggle('active',btn.dataset.category===activeCategory));
 const shown=activeCategory==='all'?poems:poems.filter(poem=>poem.category===activeCategory);
 document.getElementById('poemList').innerHTML=shown.length?shown.map(poem=>{
  const liked=!!likes[poem.id];
  return '<article class="poem"><h3>🌷 '+poem.title+'</h3><p>'+poem.body+'</p><button class="like '+(liked?'liked':'')+'" type="button" data-id="'+poem.id+'" aria-pressed="'+liked+'">'+(liked?'♥ پسندیده شد':'♡ پسندیدن')+'</button></article>';
 }).join(''):'<p class="note">هنوز شعری در این بخش نیست.</p>';
 document.querySelectorAll('.like').forEach(btn=>btn.addEventListener('click',()=>{
  const current=getLikes();const id=btn.dataset.id;
  if(current[id]) delete current[id]; else current[id]=true;
  localStorage.setItem(storageKey,JSON.stringify(current));renderPoems();
 }));
}
document.querySelectorAll('.category').forEach(btn=>btn.addEventListener('click',()=>{
 activeCategory=btn.dataset.category;renderPoems();
}));
renderPoems();
button.addEventListener('click',()=>{
  const opened=panel.classList.toggle('show');
  button.setAttribute('aria-expanded',String(opened));
  if(opened) panel.scrollIntoView({behavior:'smooth',block:'start'});
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
